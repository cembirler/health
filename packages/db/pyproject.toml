[project]
name = "db"
version = "0.1.0"
description = "Shared database layer: SQLAlchemy models, session, Alembic migrations"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "pymysql[rsa]>=1.1.2",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db"]
