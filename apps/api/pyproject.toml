[project]
name = "health-api"
version = "0.1.0"
description = "Health FastAPI backend + agent loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.44.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "certifi>=2026.2.25",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "pymysql[rsa]>=1.1.2",
    "db",
]

[tool.uv.sources]
db = { path = "../../packages/db", editable = true }

# Interactive terminal REPL for the agent:
#   uv run python -m agent.cli
# (from apps/api). Hits the same /api/agent/tools/* endpoints over HTTP —
# set API_BASE_URL=https://... to debug against a remote deployment.

